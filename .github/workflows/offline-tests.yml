name: Offline reproducibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=reports/pytest.xml
      - run: python -m tools.build_reports
      - run: python -m tools.build_docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-and-api-docs
          path: |
            reports/pytest.xml
            reports/tests.html
            docs/html/
